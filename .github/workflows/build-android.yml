name: Build Eden Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "RelWithDebInfo"
        type: choice
        options:
          - Debug
          - RelWithDebInfo
          - Release
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install ninja and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Build
        env:
          CCACHE: "true"
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t standard -b "${{ github.event.inputs.build_type || 'RelWithDebInfo' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-hd-apk
          path: artifacts/*.apk
          if-no-files-found: error
